name: Docker Build

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/leadops-crm:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/leadops-crm:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/leadops-crm:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/leadops-crm:latest

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/leadops-crm:${{ github.sha }}
          format: table
          exit-code: 0
